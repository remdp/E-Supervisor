plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs.kotlin'

    id 'kotlin-kapt'
    id 'kotlinx-serialization'
    id 'dagger.hilt.android.plugin'
    id 'com.google.dagger.hilt.android'
    // id 'kotlin-android-extensions'
    id 'kotlin-parcelize'
}

Properties props = new Properties()
def keystoreProperties = file("../release.properties")
if (keystoreProperties.exists()) {
    props.load(new FileInputStream(keystoreProperties))
}

// For Release Build
def releaseStore = "${props.getProperty('release.key.store')}"
def releaseStorePassword = "${props.getProperty('release.key.store.password')}"
def releaseKeyAlias = "${props.getProperty('release.key.alias')}"
def releaseKeyPassword = "${props.getProperty('release.key.alias.password')}"

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.euromix.esupervisor"
        minSdk 26
        targetSdk 33
        versionCode 18
        versionName "1.5.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(releaseStore)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {

        debug {
            debuggable = true
            shrinkResources = false
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"https://mobile.euromix.in.ua/presentation/hs/es/\""
            versionNameSuffix "-p"
        }

        release {
            debuggable = true
            shrinkResources = false
            minifyEnabled = false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"https://mobile.euromix.in.ua/unisales/hs/es/\""
        }

        _test_da {
            debuggable = true
            shrinkResources = false
            minifyEnabled = false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"https://mobile.euromix.in.ua/test_da/hs/es/\""
            versionNameSuffix "-test_da"
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    viewBinding {
        enabled true
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'com.euromix.esupervisor'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.javafaker:javafaker:1.0.2'

    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.2'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'

    // Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:0.8.0'

    implementation 'com.github.YarikSOffice:lingver:1.3.0'

// Dagger - Hilt
    implementation 'com.google.dagger:hilt-android:2.51.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'
// Dagger Core
    implementation 'com.google.dagger:dagger:2.51.1'
    kapt 'com.google.dagger:dagger-compiler:2.51.1'
    // Dagger Android
    api 'com.google.dagger:dagger-android:2.39'
    api 'com.google.dagger:dagger-android-support:2.37'
    kapt 'com.google.dagger:dagger-android-processor:2.37'

    kapt 'org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.5.0'

    // Glide
    implementation group: 'com.github.bumptech.glide', name: 'glide', version: '4.12.0'

    implementation 'com.github.antonKozyriatskyi:CircularProgressIndicator:1.3.0'

    implementation 'com.mapbox.maps:android:10.16.2'

    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation "org.jetbrains.kotlin:kotlin-reflect:1.9.20"

    implementation "com.daimajia.swipelayout:library:1.2.0"

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

}

kapt {
    correctErrorTypes true
}